{% extends 'jugadoresapp/base.html' %}
{% block titulo %}Iniciar sesión · Club Deportivo{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
<h1>Iniciar sesión</h1><p>Ingresa para administrar el plantel.</p>
<form method="post">{% csrf_token %}
{% if form.errors %}<div class="alert alert-danger" role="alert">Usuario o contraseña incorrectos. Intenta nuevamente.</div>{% endif %}
<label for="id_username" class="form-label">Usuario</label>
<input id="id_username" name="username" class="form-control mb-3" autocomplete="username" value="{{ form.username.value|default:'' }}" required autofocus maxlength="150">
<label for="id_password" class="form-label">Contraseña</label>
<input id="id_password" name="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
<input type="hidden" name="next" value="{{ next }}">
<button type="submit" class="btn btn-primary">Ingresar</button>
</form></div></div>
{% endblock %}
